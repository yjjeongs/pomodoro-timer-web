<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Setting</title>
  <link rel="stylesheet" href="index.css">
  <link rel="stylesheet" href="setting.css">
</head>
<body>
  <main class="container">
    <h1>setting</h1>

    <form class="setting-form" id="setting-form" novalidate>
      <label for="timer-minutes">타이머 시간(분)</label>
      <input type="number" id="timer-minutes" min="1" max="60" step="1" inputmode="numeric">
      <p class="hint" id="hint">1분 이상 60분 이하로 입력하세요.</p>

      <div class="controls">
        <button type="submit" class="btn btn-start" id="save-btn" disabled>저장</button>
        <button type="button" class="btn btn-reset" id="back-btn">돌아가기</button>
      </div>
    </form>
  </main>
  <script src="setting.js"></script>
</body>
</html>
