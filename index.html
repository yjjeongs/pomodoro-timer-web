<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pomodoro</title>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <main class="container">
      <h1>POMODORO</h1>

      <section class="timer" aria-label="남은 시간">
        <span class="time">25:00</span>
      </section>

      <section class="controls" aria-label="타이머 제어">
        <button type="button" class="btn btn-start">시작</button>
        <button type="button" class="btn btn-pause">정지</button>
        <button type="button" class="btn btn-reset">초기화</button>
      </section>

      <button type="button" class="btn btn-settings">설정</button>
    </main>
    <script src="index.js"></script>
  </body>
</html>
